[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paragent"
version = "0.1.0"
description = "Agent-first developer tooling from DevToolie"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "DevToolie", email = "siddharthmehta0906@gmail.com" },
]
keywords = ["agents", "ai", "developer-tools", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
paragent = "paragent.cli:main"

[project.urls]
Homepage = "https://github.com/DevToolie/Paragent"
Repository = "https://github.com/DevToolie/Paragent"
Issues = "https://github.com/DevToolie/Paragent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paragent"]

[tool.hatch.build.targets.sdist]
include = ["src/paragent", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["paragent"]
mypy_path = "src"
