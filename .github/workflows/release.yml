# Publish to npm when a version tag is pushed (v0.1.0, v1.2.3, …).
# Requires repository secret NPM_TOKEN with publish rights to the `paragent` package.
# Does not invent a release — someone must cut the tag after CI is green on main.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      # The tag decides *when* to publish; package.json decides *what* version
      # is published. Nothing tied the two together, so `git tag v0.2.0` on a
      # tree still saying 0.1.0 would publish 0.1.0 — or fail as "already
      # published" — with the tag claiming otherwise. Fail before the registry
      # call instead, while it is still free to fix.
      - name: Tag must match package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag ${GITHUB_REF_NAME} implies version ${tag_version}," >&2
            echo "but package.json says ${pkg_version}. Bump package.json or retag." >&2
            exit 1
          fi
          echo "publishing ${pkg_version} from tag ${GITHUB_REF_NAME}"

      - name: Verify pack contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -E 'dist/src/|contracts/|README\.md|LICENSE' /tmp/pack.txt
          # Refuse if the tarball would include secrets-shaped paths
          if grep -E '\.env|tenant\.jsonl|storage-state' /tmp/pack.txt; then
            echo "pack includes a forbidden path" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
