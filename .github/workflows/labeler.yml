name: Labeler

# pull_request_target so labelling still works on PRs from forks (the default
# pull_request token is read-only there). No repo code is checked out or run
# here, so the elevated token never touches untrusted content.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paths:
    name: path labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  size:
    name: size label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const SIZES = [
              ["size/XS", 10],
              ["size/S", 50],
              ["size/M", 200],
              ["size/L", 600],
              ["size/XL", Infinity],
            ];
            // Generated files would swamp the signal we actually want: how much
            // hand-written code a reviewer has to read.
            const IGNORED = /^(package-lock\.json|.*\.bundle\.json)$/;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const changed = files
              .filter((f) => !IGNORED.test(f.filename))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);

            const label = SIZES.find(([, max]) => changed <= max)[0];
            const existing = context.payload.pull_request.labels.map((l) => l.name);

            for (const stale of existing.filter((n) => n.startsWith("size/") && n !== label)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: stale,
              });
            }

            if (!existing.includes(label)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label],
              });
            }

            core.notice(`${changed} changed lines (excluding generated files) -> ${label}`);
