name: Dependabot auto-merge

# Queues patch/minor Dependabot PRs to merge once CI passes. Deliberately does
# NOT approve them: branch protection requires one human approving review, and
# having the bot approve its own PR would hollow that out. Net effect is you
# click Approve and it lands on green without a second visit.
on: pull_request_target

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')" != "true" ]; then
            echo "::notice::Auto-merge is not enabled on this repository — skipping."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"

      - name: Note major bumps
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major bump (${{ steps.meta.outputs.dependency-names }}) — review by hand."
