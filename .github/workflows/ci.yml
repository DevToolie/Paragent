name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: lint-typecheck-test-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Secret scan
        run: npm run secret-scan

      - name: Validate contracts
        run: npm run validate:contracts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run tests/unit

      # Exercises the seams between packages: record -> compile -> cache-write
      # -> replay, against a loopback fixture. No Docker, no model, no egress.
      - name: Integration tests
        run: npx vitest run tests/integration

  # Boots ONE pinned matrix version on the runner's Docker daemon so a broken
  # src/testbed/ Docker path cannot merge green. The full 8-version matrix stays
  # in the gate run — eight image pulls per PR is not a smoke test.
  # Not a required status check yet (see PR description follow-up).
  testbed-smoke:
    name: testbed-smoke (grafana 11.0.0)
    runs-on: ubuntu-latest
    # A hung image pull must not burn a runner.
    timeout-minutes: 10
    env:
      TESTBED_VERSION: "11.0.0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Boot and seed pinned version
        run: npm run testbed -- --version "$TESTBED_VERSION"

      # Interim stand-in for `npm run testbed -- --version <X> --verify` (#57):
      # asserts /api/health plus the presence of the seed dashboard/datasource.
      - name: Assert healthy and seeded
        run: node scripts/testbed/ci-smoke-assert.mjs --version "$TESTBED_VERSION"

      - name: Tear down
        if: always()
        run: npm run testbed -- --version "$TESTBED_VERSION" --down

  canary:
    name: privacy-canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Privacy canary (merge-blocking)
        run: npm run test:canary
