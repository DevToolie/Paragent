name: Main guard

# This does NOT protect main. It cannot: GitHub only offers branch protection on
# public repos under a free plan, and ADR-0002 keeps this repo private. A push
# straight to main will succeed — this workflow just makes sure it is never
# silent, by failing the run and filing an issue.
#
# Delete this workflow once real protection is in place (`npm run protect:main`
# after upgrading the org to GitHub Team).
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reviewed:
    name: pushes to main came from a PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pusher = context.payload.pusher?.name ?? context.actor;
            if (["dependabot[bot]", "github-actions[bot]"].includes(context.actor)) {
              core.notice(`Skipping bot push by ${context.actor}.`);
              return;
            }

            const commits = context.payload.commits ?? [];
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            const unreviewed = [];

            for (const commit of commits) {
              const { data: prs } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  ...common,
                  commit_sha: commit.id,
                });
              // A squash merge leaves the commit associated with its PR, so an
              // empty list means the commit reached main without one.
              if (prs.length === 0) unreviewed.push(commit);
            }

            if (unreviewed.length === 0) {
              core.notice(`All ${commits.length} commit(s) arrived via a pull request.`);
              return;
            }

            const list = unreviewed
              .map((c) => `- \`${c.id.slice(0, 8)}\` ${c.message.split("\n")[0]}`)
              .join("\n");
            const title = `Unreviewed push to main by @${pusher}`;

            const { data: open } = await github.rest.issues.listForRepo({
              ...common,
              state: "open",
              labels: "founder",
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title);

            const body = [
              `${unreviewed.length} commit(s) reached \`main\` without a pull request:`,
              "",
              list,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "`main` is not protected — GitHub only offers branch protection on public",
              "repos under a free plan, and ADR-0002 keeps this repo private. Until the",
              "org is on GitHub Team, this is the only signal that a push bypassed review.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                ...common,
                issue_number: existing.number,
                body,
              });
              core.setFailed(`Unreviewed push — commented on #${existing.number}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              ...common,
              title,
              body,
              labels: ["founder"],
              assignees: [pusher],
            });
            core.setFailed(`Unreviewed push — filed #${issue.number}`);
