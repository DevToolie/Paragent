name: Stale

# Adapted from the org reference workflow in DevToolie/.github.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been marked as stale due to inactivity.
            It will be closed in 14 days if there is no further activity.
          stale-pr-message: >
            This pull request has been marked as stale due to inactivity.
            It will be closed in 14 days if there is no further activity.
          # gate/track work is deliberately long-running, and founder decisions
          # stay open until they are decided.
          exempt-issue-labels: "security,pinned,epic,gate,founder,proposal"
          exempt-pr-labels: "security,pinned,gate"
